<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Clock</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="title-wrap">
          <p class="eyebrow">Global time</p>
          <h1>World Clock</h1>
        </div>

        <div class="toolbar">
          <button id="theme-toggle" class="tool-button" type="button" aria-label="Toggle theme">
            <span class="theme-label">Light</span>
          </button>
          <button id="compact-toggle" class="tool-button" type="button" aria-label="Toggle compact mode">
            Compact
          </button>
          <button id="show-favorites" class="tool-button" type="button" aria-label="Show favorites">
            Favorites
          </button>
          <button id="add-local-timezone" class="tool-button accent" type="button">
            Add My Timezone
          </button>
          <button id="clear-all" class="tool-button danger" type="button">
            Clear
          </button>
        </div>
      </header>

      <section class="search-panel">
        <label class="sr-only" for="timezone-search">Search timezone</label>
        <input
          id="timezone-search"
          type="text"
          autocomplete="off"
          placeholder="Search city or timezone (Tokyo, London, New York)"
        />
        <div id="search-results" class="search-results" aria-live="polite"></div>
      </section>

      <main>
        <section id="clocks" class="clock-grid" aria-live="polite"></section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
